# Régénère les données (export statique) et déploie dist/ en production sur Vercel.
#
# Déclencheurs :
#   - planifié : toutes les 3 h (00:41, 03:41… 21:41 UTC), du vendredi au mardi,
#     de septembre à février. Chaque passage lance d'abord un job « check »
#     très léger (environ 20 s, sans dépendances : scripts/check_updates.py)
#     qui regarde si nflverse a publié quelque chose depuis le dernier export :
#     dates de mise à jour des fichiers de stats (API GitHub des releases
#     nflverse-data) et scores du calendrier. Le job « deploy » (export
#     complet, tests, déploiement) ne tourne que dans ce cas, ou une fois par
#     jour au minimum pour rafraîchir les effectifs. Hors saison : aucune
#     exécution planifiée.
#   - push sur main, sauf si seuls la documentation ou les scripts changent ;
#     les données en cache (moins de 6 h) sont alors réutilisées.
#   - à la main : onglet Actions > Déploiement Vercel > Run workflow, avec ou
#     sans retéléchargement des données.
#
# Alerte : si un match terminé depuis plus de 24 h n'a toujours pas de stats
# sur le site (ou un match commencé depuis plus de 28 h n'a pas de score),
# l'exécution échoue avec la liste des matchs, et GitHub envoie un e-mail.
#
# État gardé dans le cache de l'Action (.deploy-state/) : relevé des sources
# nflverse du dernier export réussi (sources.json), état des matchs sur le
# site (status.json), empreinte des données déployées (hash).
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

name: Déploiement Vercel

on:
  schedule:
    # minute heure jour mois jour-de-semaine (0 = dimanche) : vendredi à mardi
    - cron: "41 */3 * 1,2,9-12 0,1,2,5,6"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "scripts/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Retélécharger les données nflverse"
        type: boolean
        default: true

permissions:
  contents: read

# Une seule exécution à la fois. Une exécution en cours n'est pas annulée (un
# passage planifié ne doit pas interrompre un déploiement) : la suivante attend.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Vérification légère, sur les exécutions planifiées seulement.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - name: Récupérer le script de vérification
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/check_updates.py
          sparse-checkout-cone-mode: false

      - name: Restaurer l'état du dernier export
        uses: actions/cache/restore@v4
        with:
          path: .deploy-state
          key: deploy-state-${{ github.run_id }}
          restore-keys: deploy-state-

      - name: Nouvelles données nflverse ?
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_updates.py decide --state .deploy-state

      # Rien de nouveau : l'état en cache est celui du site, on peut alerter.
      # (Sinon, l'alerte est évaluée après l'export, dans le job deploy.)
      - name: Matchs en retard de publication ?
        if: steps.decide.outputs.changed == 'false'
        run: python3 scripts/check_updates.py alert --state .deploy-state

  deploy:
    needs: check
    # Push et lancement manuel : toujours. Planifié : seulement si « check » a
    # vu de nouvelles données.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # Cache local des données (data/) de la dernière exécution : la saison
      # précédente n'est jamais retéléchargée, et un push réutilise des données
      # de moins de 6 h.
      - name: Restaurer les données en cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: nflverse-data-${{ github.run_id }}
          restore-keys: nflverse-data-

      - name: Restaurer l'état du dernier export
        uses: actions/cache/restore@v4
        with:
          path: .deploy-state
          key: deploy-state-${{ github.run_id }}
          restore-keys: deploy-state-

      # Relevé pris avant le téléchargement : une publication nflverse
      # survenue pendant l'export sera vue au passage suivant.
      - name: Relever l'état des sources nflverse
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_updates.py snapshot --out sources-new.json

      # Planifié, ou manuel avec « Retélécharger » : téléchargement forcé ; en
      # cas d'échec, l'étape échoue et rien n'est déployé.
      # Push : cache réutilisé s'il a moins de 6 h, sinon téléchargement.
      - name: Exporter le site statique
        timeout-minutes: 10
        env:
          EVENT: ${{ github.event_name }}
          REFRESH_INPUT: ${{ inputs.refresh }}
        run: |
          args="--out dist --hash-file data-hash.txt --status-file status-new.json"
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$REFRESH_INPUT" = "false" ]; }; then
            python -m app.export $args
          else
            python -m app.export --refresh $args
          fi

      - name: Sauvegarder les données en cache
        uses: actions/cache/save@v4
        with:
          path: data
          key: nflverse-data-${{ github.run_id }}

      - name: Tests
        timeout-minutes: 5
        run: python -m pytest -q

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Middleware de protection (mot de passe, cookie signé) : aucun déploiement s'il échoue.
      - name: Tests du middleware
        timeout-minutes: 2
        run: node --test "tests/js/*.test.js"

      - name: Décider du déploiement
        id: decide
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          new=$(cat data-hash.txt)
          old=$(cat .deploy-state/hash 2>/dev/null || echo "aucune")
          echo "Empreinte actuelle : $new"
          echo "Dernier déploiement : $old"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          # record : l'état de l'export devient celui du site (déployé, ou
          # identique à ce qui est déjà en ligne). Sans secrets : rien.
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "record=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets Vercel absents (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) : export et tests OK, déploiement sauté."
            echo "Secrets Vercel absents : déploiement sauté (voir README, section Déploiement)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT" = "schedule" ] && [ "$new" = "$old" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "record=true" >> "$GITHUB_OUTPUT"
            echo "Données du site inchangées : déploiement sauté." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "record=true" >> "$GITHUB_OUTPUT"
          fi

      # Paquets npm de la CLI Vercel en cache (renouvelé chaque mois pour
      # suivre les nouvelles versions).
      - name: Cache npm de la CLI Vercel
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-vercel-${{ runner.os }}-${{ steps.decide.outputs.month }}
          restore-keys: npm-vercel-${{ runner.os }}-

      - name: Installer la CLI Vercel
        if: steps.decide.outputs.deploy == 'true'
        timeout-minutes: 3
        run: npm install --global --prefer-offline --no-audit --no-fund vercel@latest

      - name: Récupérer la configuration du projet Vercel
        if: steps.decide.outputs.deploy == 'true'
        timeout-minutes: 2
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Construire (copie de dist/)
        if: steps.decide.outputs.deploy == 'true'
        timeout-minutes: 3
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Vercel n'envoie que les fichiers qui ont changé (dédoublonnage par
      # empreinte) : un export complet ne coûte donc pas un envoi complet.
      - name: Déployer en production
        if: steps.decide.outputs.deploy == 'true'
        timeout-minutes: 5
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Déployé : $url" >> "$GITHUB_STEP_SUMMARY"

      # Déployé, ou données identiques à celles du site : l'état devient
      # celui du site. Sans secrets Vercel, rien n'est enregistré.
      - name: Mémoriser l'état du site
        id: state
        if: steps.decide.outputs.record == 'true'
        run: |
          mkdir -p .deploy-state
          cp data-hash.txt .deploy-state/hash
          cp sources-new.json .deploy-state/sources.json
          cp status-new.json .deploy-state/status.json

      - name: Sauvegarder l'état
        if: steps.state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .deploy-state
          key: deploy-state-${{ github.run_id }}

      # Après le déploiement : le site est à jour, mais un match reste-t-il
      # sans stats plus de 24 h après sa fin ? Échec (et e-mail) si oui.
      - name: Matchs en retard de publication ?
        if: steps.state.outcome == 'success'
        run: python scripts/check_updates.py alert --state .deploy-state
