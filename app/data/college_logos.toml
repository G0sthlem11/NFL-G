# Correspondances manuelles : nom d'université nflverse -> identifiant ESPN.
# Lu par py -m scripts.fetch_college_logos, avant la correspondance automatique.
# Ne mettre ici que les cas ambigus ou mal orthographiés. false : pas de logo,
# volontairement (le nom s'affiche seul).
# Identifiants : https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams?limit=1000

[colleges]
# Homonymes : le nom seul désigne plusieurs équipes ESPN, ou la mauvaise.
"Miami" = "2390"                # Miami (Floride), Hurricanes
"Miami (Ohio)" = "193"          # Miami (OH) RedHawks
"USC" = "30"                    # Southern California Trojans
"Texas" = "251"                 # Longhorns (pas Texas College)
"Illinois" = "356"              # Fighting Illini (pas Illinois College)
"Idaho" = "70"                  # Vandals (pas College of Idaho)
"Troy" = "2653"                 # Troy Trojans (pas Troy Vikings)
"Charlotte" = "2429"            # 49ers (pas Charlotte Saints)

