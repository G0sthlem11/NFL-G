<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFL Gameday</title>
  <meta name="description" content="Résultats, statistiques et joueurs clés des matchs NFL de la saison, d'après les données nflverse.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Écran d'accueil / installation. crossorigin="use-credentials" est indispensable :
       le site est derrière Vercel Authentication, et sans cookie le manifeste
       renverrait la page de connexion. -->
  <link rel="manifest" href="/manifest.webmanifest?v=2" crossorigin="use-credentials">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#F5F1E8">
  <meta name="apple-mobile-web-app-title" content="Gameday">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="styles.css?v=26">
</head>
<body>
  <header class="masthead">
    <div class="masthead-row">
      <a class="wordmark" href="#/">
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <g fill="currentColor">
            <rect x="20" y="10" width="6" height="48"/>
            <rect x="74" y="10" width="6" height="48"/>
            <rect x="20" y="52" width="60" height="6"/>
            <rect x="47" y="58" width="6" height="34"/>
          </g>
          <circle cx="50" cy="30" r="7" fill="#B4532A"/>
        </svg>
        <span>NFL Gameday</span>
      </a>
      <nav class="nav" aria-label="Navigation principale">
        <a href="#/" data-nav="week">Matchs</a>
        <a href="#/standings" data-nav="standings">Équipes</a>
        <a href="#/rankings" data-nav="rankings">Joueurs</a>
      </nav>
    </div>
    <div class="masthead-meta">
      <span id="season"></span>
      <span class="meta-sep" aria-hidden="true">·</span>
      <span id="updated" aria-live="polite"></span>
      <button type="button" id="refresh" class="link-button" title="Retélécharger les données nflverse">Actualiser</button>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <noscript><p class="state-msg">Cette application a besoin de JavaScript pour afficher les matchs.</p></noscript>
  </main>

  <footer class="colophon">
    <p>Données <a href="https://github.com/nflverse">nflverse</a>, publiées quelques heures après les matchs. Pas de suivi en direct. Heures de Paris.</p>
  </footer>

  <script src="config.js?v=17"></script>
  <!-- Motion (https://motion.dev), copie locale de motion@14.4.0, licence MIT. -->
  <script src="vendor/motion.js?v=14.4.0"></script>
  <script src="anim.js?v=25"></script>
  <script src="app.js?v=28"></script>
</body>
</html>
