<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFL Gameday</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="/static/styles.css?v=5">
</head>
<body>
  <header class="masthead">
    <div class="masthead-row">
      <a class="wordmark" href="#/">NFL Gameday</a>
      <nav class="nav" aria-label="Navigation principale">
        <a href="#/" data-nav="week">Matchs</a>
      </nav>
    </div>
    <div class="masthead-meta">
      <span id="season"></span>
      <span class="meta-sep" aria-hidden="true">·</span>
      <span id="updated"></span>
      <button type="button" id="refresh" class="link-button">Actualiser</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="colophon">
    <p>Données <a href="https://github.com/nflverse">nflverse</a>, publiées quelques heures après les matchs. Pas de suivi en direct. Heures de Paris.</p>
  </footer>

  <script src="/static/app.js?v=5"></script>
</body>
</html>
